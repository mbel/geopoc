name: Android APK (debug)

# Construit un APK de TEST installable sur un téléphone Android (mode solo, sans serveur).
# Lancement : onglet « Actions » → « Android APK (debug) » → « Run workflow ».
# Résultat : artefact « geoclash-debug-apk » téléchargeable sur la page de l'exécution.
on:
  workflow_dispatch:
  push:
    tags: ["android-*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 6 / Android Gradle Plugin 8.2 : JDK 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'application web
        run: npm run build -w @geoclash/web
        env:
          # Optionnel : URL du serveur de jeu (variable de dépôt GEOCLASH_SERVER_URL, ex. wss://jeu.exemple.com).
          # Vide = mode en ligne désactivé, solo uniquement.
          VITE_SERVER_URL: ${{ vars.GEOCLASH_SERVER_URL }}

      - name: Copier le build web dans le projet Android
        working-directory: apps/web
        run: npx cap sync android

      - name: Accepter les licences du SDK Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compiler l'APK de debug
        working-directory: apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Nommer l'APK
        run: |
          mkdir -p dist-apk
          cp apps/web/android/app/build/outputs/apk/debug/app-debug.apk "dist-apk/geoclash-debug-${GITHUB_SHA::7}.apk"
          ls -lh dist-apk

      - uses: actions/upload-artifact@v4
        with:
          name: geoclash-debug-apk
          path: dist-apk/*.apk
          retention-days: 14
          if-no-files-found: error
